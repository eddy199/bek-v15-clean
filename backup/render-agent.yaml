services:
  - type: web
    name: crm-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8765"
      - key: API_URL
        sync: false
        # Remplacer par l'URL Render de l'API
        # Exemple : https://crm-api-xxx.onrender.com
      - key: AGENT_BRIDGE_SECRET
        sync: false
