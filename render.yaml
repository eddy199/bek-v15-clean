services:
  - type: web
    name: bek-v16-core
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health/worker
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      playwright install chromium
    startCommand: python app.py
    envVars:
      # --- Python ---
      - key: PYTHON_VERSION
        value: "3.11.8"

      # --- Flags BEK ---
      - key: BEK_BOOTSTRAPPED
        value: "1"
      - key: BEK_ENABLE_EVENT_BUS_NERVES
        value: "true"
      - key: BEK_ENABLE_HERMES_NERVES
        value: "true"
      - key: BEK_ENABLE_SKILLS_NERVES
        value: "true"
      - key: BEK_ENABLE_HEADLESS_NERVES
        value: "true"
      - key: BEK_ENABLE_TMUX_NERVES
        value: "true"
      - key: BEK_ENABLE_WEB_AGENT_NERVES
        value: "true"
      - key: BEK_ENABLE_GUARDIAN_NERVES
        value: "true"
      - key: BEK_ENABLE_APPROVAL_NERVES
        value: "true"
      - key: BEK_ENABLE_MCP_NERVES
        value: "true"
      - key: BEK_ENABLE_COGNITIVE_NERVES
        value: "true"
      - key: BEK_ENABLE_ROUTER_NERVES
        value: "true"
      - key: BEK_ENABLE_CRM_NERVES
        value: "true"

      # --- Variables SECRÈTES (à renseigner dans l'UI Render) ---
      # NE PAS METTRE DE VALEUR ICI. sync: false = défini dans le dashboard.
      - key: BEK_HSM_SECRET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: B_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: AIONLABS_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: NVIDIA_EMBEDDING_MODEL
        value: "nvidia/nemotron-3-embed-1b"