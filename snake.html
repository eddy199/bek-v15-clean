<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - BEK Codex</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            color: #e94560;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 1rem;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #e94560;
        }

        #game-container {
            position: relative;
            border: 4px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            background: #16213e;
        }

        canvas {
            display: block;
            background: #0f3460;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .hud span {
            color: #16213e;
            background: #e94560;
            padding: 5px 15px;
            border-radius: 5px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(22, 33, 62, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        button {
            background: #e94560;
            color: #16213e;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            border-radius: 5px;
            transition: transform 0.1s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #e94560;
        }

        button:active {
            transform: scale(0.95);
        }

        .controls {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #888;
        }

        @media (max-width: 450px) {
            .hud, #game-container {
                width: 90vw;
            }
            canvas {
                width: 100%;
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <div class="hud">
        <span>Score: <span id="score">0</span></span>
        <span>Best: <span id="best">0</span></span>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay">
            <h2 id="overlay-title">GAME OVER</h2>
            <p id="overlay-score">Score final: 0</p>
            <button id="restartBtn">REJOUER</button>
        </div>
    </div>
    <div class="controls">
        Utilisez les flèches du clavier pour vous déplacer<br>
        Appuyez sur ESPACE pour démarrer / mettre en pause
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayScore = document.getElementById('overlay-score');
        const restartBtn = document.getElementById('restartBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let score = 0;
        let best = localStorage.getItem('snakeBest') || 0;
        let gameLoopId = null;
        let isRunning = false;
        let isPaused = false;
        let lastTime = 0;
        const moveInterval = 120;
        let lastMoveTime = 0;

        bestEl.textContent = best;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreEl.textContent = score;
            placeFood();
            isRunning = true;
            isPaused = false;
            overlay.classList.add('hidden');
            lastTime = performance.now();
            lastMoveTime = lastTime;
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                valid = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameLoop(currentTime) {
            if (!isRunning) return;

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (!isPaused && currentTime - lastMoveTime >= moveInterval) {
                update();
                lastMoveTime = currentTime;
            }

            draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#16213e';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            ctx.fillStyle = '#e94560';
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = i === 0 ? '#4ecca3' : '#45b7d1';
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
                ctx.strokeStyle = '#16213e';
                ctx.lineWidth = 1;
                ctx.strokeRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
            }
        }

        function gameOver() {
            isRunning = false;
            if (score > best) {
                best = score;
                localStorage.setItem('snakeBest', best);
                bestEl.textContent = best;
                overlayTitle.textContent = 'NOUVEAU RECORD!'
            } else {
                overlayTitle.textContent = 'GAME OVER'
            }
            overlayScore.textContent = 'Score final: ' + score;
            overlay.classList.remove('hidden');
        }

        function handleKeyDown(e) {
            switch (e.key) {
                case 'ArrowUp':
                    if (dy === 0 && isRunning) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy === 0 && isRunning) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx === 0 && isRunning) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx === 0 && isRunning) { nextDx = 1; nextDy = 0; }
                    break;
                case ' ':
                    e.preventDefault();
                    if (!isRunning) {
                        initGame();
                    } else {
                        isPaused = !isPaused;
                    }
                    break;
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        restartBtn.addEventListener('click', initGame);

        // Initial draw
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e94560';
        ctx.font = '20px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('APPUYEZ SUR ESPACE', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
